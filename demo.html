<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>charged ⚡ — see how it works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --black-2: #0A0A0A;
    --black-3: #111111;
    --black-4: #1A1A1A;
    --gold: #F5A623;
    --gold-bright: #FFD166;
    --gold-dim: #B87A10;
    --white: #FFFFFF;
    --off-white: #E8E8E8;
    --grey: #777777;
    --electric: #4FC3F7;
    --green: #00E676;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; background-color: #000; overflow-x: hidden; }

  body {
    background-color: #000;
    color: var(--white);
    font-family: 'Figtree', sans-serif;
    font-size: 16px;
    line-height: 1.6;
  }

  /* LOGO */
  .logo-img {
    height: 44px;
    width: auto;
    display: block;
    object-fit: contain;
  }
  .footer-logo {
    height: 44px;
    width: auto;
    display: block;
    object-fit: contain;
  }
  @media (max-width: 768px) {
    .logo-img { height: 38px; }
    .footer-logo { height: 38px; }
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 16px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #000;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .nav-logo { text-decoration: none; display: flex; align-items: center; }
  .nav-cta {
    background: var(--gold);
    color: var(--black);
    font-family: 'Figtree', sans-serif;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 11px 22px;
    border-radius: 4px;
    text-decoration: none;
    transition: all 0.2s;
  }
  .nav-cta:hover { background: var(--gold-bright); transform: translateY(-1px); }

  /* HERO */
  .demo-hero {
    padding: 140px 40px 80px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .demo-hero::before {
    content: '';
    position: absolute;
    top: -10%; left: 50%;
    transform: translateX(-50%);
    width: 800px; height: 500px;
    background: radial-gradient(ellipse, rgba(245,166,35,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
  .demo-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.2s;
  }
  .demo-hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 9vw, 100px);
    line-height: 0.95;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.35s;
  }
  .demo-hero h1 span { color: var(--gold); }
  .demo-hero p {
    font-size: clamp(16px, 2vw, 20px);
    font-weight: 300;
    color: var(--off-white);
    max-width: 560px;
    margin: 0 auto 56px;
    line-height: 1.6;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.5s;
  }

  /* PROTOTYPE SECTION */
  .prototype-wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 40px 100px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.65s;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 32px;
  }
  .tab {
    background: var(--black-4);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'Figtree', sans-serif;
    font-weight: 600;
    color: var(--grey);
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .tab:hover { border-color: rgba(245,166,35,0.4); color: var(--off-white); }
  .tab.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--black);
  }

  /* PHONE */
  .phone-outer {
    display: flex;
    justify-content: center;
  }
  .phone {
    width: 360px;
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #e5ddd5;
    display: flex;
    flex-direction: column;
    height: 680px;
    overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px rgba(245,166,35,0.08);
  }

  /* WA HEADER */
  .wa-head {
    background: #075e54;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .wa-back { color: rgba(255,255,255,0.8); font-size: 18px; padding: 2px 4px; }
  .wa-av {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), #FF8C00);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px; color: var(--black); flex-shrink: 0;
  }
  .wa-name { font-size: 14px; font-weight: 600; color: #fff; }
  .wa-sub { font-size: 11px; color: rgba(255,255,255,0.65); }

  /* MESSAGES */
  .messages {
    flex: 1; overflow-y: auto; padding: 10px;
    display: flex; flex-direction: column; gap: 5px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }

  .bubble {
    max-width: 80%; padding: 8px 12px; border-radius: 10px;
    font-size: 13px; line-height: 1.5; word-break: break-word;
    font-family: 'Figtree', sans-serif;
  }
  .bubble.in { background: #fff; align-self: flex-start; border-top-left-radius: 2px; color: #111; }
  .bubble.out { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 2px; color: #111; }
  .btime { font-size: 10px; color: rgba(0,0,0,0.38); text-align: right; margin-top: 3px; }
  .bubble.out .btime { color: rgba(0,90,40,0.55); }

  .divider {
    align-self: center; font-size: 11px; color: rgba(0,0,0,0.45);
    background: rgba(255,255,255,0.55); padding: 3px 10px;
    border-radius: 10px; margin: 3px 0;
    font-family: 'Figtree', sans-serif;
  }

  .dot-wrap {
    background: #fff; align-self: flex-start; border-radius: 10px;
    border-top-left-radius: 2px; padding: 9px 13px;
    display: flex; gap: 4px; align-items: center;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #bbb; animation: bop 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes bop { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-4px); } }

  /* QR + INPUT */
  .qr-area {
    background: #ebebeb; padding: 6px 10px;
    display: flex; flex-wrap: wrap; gap: 5px; min-height: 10px; flex-shrink: 0;
  }
  .qr {
    background: #fff; border: 1px solid #25d366; color: #075e54;
    border-radius: 16px; padding: 5px 12px; font-size: 12px; cursor: pointer;
    font-family: 'Figtree', sans-serif; font-weight: 500; transition: background 0.15s;
  }
  .qr:hover { background: #eafcea; }
  .hint { background: #ebebeb; font-size: 11px; color: rgba(0,0,0,0.42); padding: 1px 12px 5px; font-style: italic; flex-shrink: 0; font-family: 'Figtree', sans-serif; }
  .input-row { background: #ebebeb; padding: 7px 10px; display: flex; gap: 7px; align-items: center; flex-shrink: 0; }
  .inp {
    flex: 1; background: #fff; border: none; border-radius: 20px;
    padding: 7px 12px; font-size: 13px; font-family: 'Figtree', sans-serif;
    outline: none; color: #111;
  }
  .inp:disabled { background: #ddd; color: #999; }
  .send-btn {
    width: 34px; height: 34px; border-radius: 50%; background: #25d366; border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 16px; flex-shrink: 0;
  }
  .send-btn:hover { background: #1db954; }

  /* PORTAL LINK */
  .portal-pill {
    margin-top: 7px; background: #e6f4ea; border-radius: 7px;
    padding: 7px 9px; display: flex; align-items: center; gap: 7px;
    cursor: pointer; text-decoration: none;
  }
  .portal-pill span { font-size: 12px; color: #075e54; font-weight: 600; }

  /* FOOTER */
  footer {
    padding: 48px 40px;
    border-top: 1px solid rgba(255,255,255,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
    background: var(--black-2);
  }
  footer .links { display: flex; gap: 24px; flex-wrap: wrap; }
  footer .links a { font-size: 13px; font-weight: 500; color: var(--grey); text-decoration: none; transition: color 0.2s; }
  footer .links a:hover { color: var(--white); }
  footer .copy { font-size: 12px; color: rgba(255,255,255,0.18); font-weight: 400; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    nav { padding: 16px 20px; }
    .demo-hero { padding: 110px 20px 60px; }
    .prototype-wrap { padding: 0 20px 80px; }
    .phone { width: 100%; max-width: 360px; }
    footer { padding: 32px 20px; flex-direction: column; align-items: flex-start; }
  }
</style>
</head>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/9k=" alt="charged" class="logo-img footer-logo">

    <a href="https://getcharged.energy">home</a>
    <a href="#">privacy policy</a>
    <a href="#">contact</a>
  </div>
  <p class="copy">© 2025 charged. all rights reserved.</p>
</footer>

<script>
var busy = false;
var flow = 'onboarding';
var obStage = 'idle';

var PROVIDERS = ['e.on','british gas','octopus','ovo','edf','bulb','other'];
var CATS = ['🛒 groceries','💄 beauty & health','👗 fashion','🏠 home & garden','📱 tech & electronics','🍕 food & drink','✈️ travel'];

var OFFERS = {
  'groceries':'🛒 tesco — 4%\n🛒 sainsbury\'s — 3.5%\n🛒 waitrose — 3%',
  'beauty & health':'💄 boots — 6%\n💄 lookfantastic — 5%\n💄 holland & barrett — 4%',
  'fashion':'👗 m&s — 4%\n👗 next — 5%\n👗 asos — 3.5%',
  'home & garden':'🏠 b&q — 4%\n🏠 dunelm — 5%\n🏠 ikea — 3%',
  'tech & electronics':'📱 currys — 3%\n📱 ao.com — 4%\n📱 john lewis — 2.5%',
  'food & drink':'🍕 just eat — 5%\n🍕 deliveroo — 4%\n🍕 uber eats — 3.5%',
  'travel':'✈️ booking.com — 4%\n✈️ expedia — 3.5%\n✈️ trainline — 2%'
};

function t() {
  var n = new Date();
  return ('0'+n.getHours()).slice(-2)+':'+('0'+n.getMinutes()).slice(-2);
}

function scrollDown() {
  var el = document.getElementById('msgs');
  el.scrollTop = el.scrollHeight;
}

function addDivider(txt) {
  var d = document.createElement('div');
  d.className = 'divider'; d.textContent = txt;
  document.getElementById('msgs').appendChild(d);
  scrollDown();
}

function addBubble(who, txt, linkUrl) {
  var m = document.getElementById('msgs');
  var d = document.createElement('div');
  d.className = 'bubble ' + (who==='user' ? 'out' : 'in');
  var p = document.createElement('div');
  p.style.whiteSpace = 'pre-wrap'; p.textContent = txt;
  d.appendChild(p);
  if (linkUrl) {
    var a = document.createElement('a');
    a.className = 'portal-pill'; a.href = linkUrl; a.target = '_blank';
    a.innerHTML = '🔗 <span>getcharged.energy/offers ↗</span>';
    d.appendChild(a);
  }
  var ts = document.createElement('div');
  ts.className = 'btime'; ts.textContent = t();
  d.appendChild(ts);
  m.appendChild(d); scrollDown();
}

function showDots() {
  var m = document.getElementById('msgs');
  var d = document.createElement('div');
  d.className = 'dot-wrap'; d.id = 'dots';
  d.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  m.appendChild(d); scrollDown();
}

function hideDots() {
  var el = document.getElementById('dots');
  if (el) el.remove();
}

function setQRs(arr, handler) {
  var qr = document.getElementById('qrs');
  qr.innerHTML = '';
  if (!arr || !arr.length) return;
  arr.forEach(function(label) {
    var b = document.createElement('button');
    b.className = 'qr'; b.textContent = label;
    b.onclick = function() { if(!busy) handler(label); };
    qr.appendChild(b);
  });
}

function clearQRs() { document.getElementById('qrs').innerHTML = ''; }
function setHint(h) { document.getElementById('hint').textContent = h||''; }

function enableInp(ph, hint) {
  var i = document.getElementById('inp');
  i.disabled = false; i.placeholder = ph||'message'; setHint(hint||'');
  i.focus();
}
function disableInp() {
  var i = document.getElementById('inp');
  i.disabled = true; i.placeholder = 'message'; setHint('');
}

function botSay(txt, delay, cb, linkUrl) {
  delay = delay || 900;
  busy = true; showDots();
  setTimeout(function() {
    hideDots(); busy = false;
    addBubble('charged', txt, linkUrl);
    if (cb) cb();
  }, delay);
}

function loadFlow(name) {
  flow = name; busy = false; obStage = 'idle';
  document.getElementById('msgs').innerHTML = '';
  clearQRs(); disableInp(); setHint('');
  document.querySelectorAll('.tab').forEach(function(tb) {
    var map = {onboarding:'onboarding',cashback:'cashback notification',balance:'balance check',offers:'browse offers',addcard:'add card'};
    tb.classList.toggle('active', tb.textContent.trim() === map[name]);
  });
  if (name==='onboarding') startOnboarding();
  else if (name==='cashback') startCashback();
  else if (name==='balance') startBalance();
  else if (name==='addcard') startAddCard();
}

function startOnboarding() {
  addDivider('today');
  botSay('you made it 👏 welcome to the charged inner circle\n\nyou\'re in early & we want to build with you 🧰\n\nwhy we were born 👶:\nenergy bills are rising and cashback tools are a faff. we\'re fixing both 🔧\n\nnative to whatsapp 📱\ncharged lives in whatsapp — just message us before any big spend and we\'ll tell you how much you can save 👀\n\nenergy transfer ⚡:\ncashback goes straight to your energy account as non-refundable credit 💸\n\nthe finished article:\n🔗 link your card once\n🛍️ spend as normal\n⚡ credit lands in your energy account\n\nstart building with us — reply and tell us:\n⚡ who is your energy provider?\n🛒 top 5 brands you spend with?\n\nwe\'ll keep you updated with our build and launch 🚀 (no spam here)', 1200, function() {
    botSay('first up — who\'s your energy provider? 👇', 700, function() {
      setQRs(PROVIDERS, function(p) {
        clearQRs(); addBubble('user', p);
        botSay('noted — ' + p + ' 👌\n\nnow tell us the top 5 brands you spend with 🛒\n\njust type them below, separated by commas', 900, function() {
          obStage = 'brands';
          enableInp('e.g. tesco, amazon, boots, m&s, argos', 'type your top 5 brands, separated by commas');
        });
      });
    });
  });
}

function startCashback() {
  addDivider('today');
  botSay('⚡ cashback confirmed. £4.20 from tesco has been added to your energy credit. your total balance is now £11.60.', 800, function() {
    botSay('that\'s £11.60 heading straight to your e.on bill 🙌\n\nkeep it up and you\'ll clear over £100 this year at your current pace', 700, function() {
      setQRs(['see my full balance','what other offers do i have?','nice one 👏'], cashbackReply);
    });
  });
}

function cashbackReply(r) {
  clearQRs(); addBubble('user', r);
  if (r==='see my full balance') {
    showBalance();
  } else if (r==='what other offers do i have?') {
    botSay('how do you want to browse? 👇', 800, function() {
      setQRs(['choose a category','view in portal'], offersBrowseReply);
    });
  } else if (r==='nice one 👏') {
    botSay('you\'re doing the work — we\'re just sending it where it matters ⚡', 800, function() {
      setQRs(['see my full balance','what other offers do i have?'], cashbackReply);
    });
  }
}

function offersBrowseReply(r) {
  clearQRs(); addBubble('user', r);
  if (r==='choose a category') {
    botSay('pick a category and i\'ll show you what\'s live 👇', 700, function() {
      setQRs(CATS, catReply);
    });
  } else if (r==='view in portal') {
    botSay('here\'s your full offer list — no login needed 🔓', 800, null, 'https://getcharged.energy/offers');
    setTimeout(function() {
      setQRs(['choose a category'], offersBrowseReply);
    }, 900);
  }
}

function catReply(r) {
  clearQRs(); addBubble('user', r);
  var key = r.replace(/^.{2}/,'').trim().toLowerCase();
  var offers = OFFERS[key] || '— checking live offers...';
  botSay('live offers in ' + r + ':\n\n' + offers, 800, function() {
    setQRs(['choose another category','see my balance'], function(r2) {
      clearQRs(); addBubble('user', r2);
      if (r2==='choose another category') {
        botSay('pick another category 👇', 600, function() { setQRs(CATS, catReply); });
      } else {
        showBalance();
      }
    });
  });
}

function showBalance() {
  botSay('here\'s where you\'re at ⚡\n\n💰 total earned: £23.40\n✅ sent to e.on: £12.00\n⏳ pending: £4.20\n📊 next transfer: 1 jul\n\nyou\'re on track for £280 this year 🙌', 900, function() {
    setQRs(['see recent transactions','when does it hit my bill?'], balanceReply);
  });
}

function balanceReply(r) {
  clearQRs(); addBubble('user', r);
  if (r==='see recent transactions') {
    botSay('your last 5 transactions:\n\n🛒 tesco — £4.20 — 2 jun\n🛒 boots — £1.80 — 29 may\n🛒 amazon — £3.60 — 27 may\n🛒 tesco — £2.10 — 21 may\n🛒 m&s — £0.90 — 18 may\n\ntotal this month: £12.60 🎉', 900, function() {
      setQRs(['when does it hit my bill?'], balanceReply);
    });
  } else if (r==='when does it hit my bill?') {
    botSay('we batch transfers on the 1st of each month 📅\n\nyour next transfer is £7.40 landing on your e.on account on 1 jul — applied automatically as non-refundable credit.', 900, function() {
      setQRs(['see recent transactions'], balanceReply);
    });
  }
}

function startBalance() {
  addDivider('today');
  enableInp('message','');
  addBubble('user','how much have i saved?');
  showBalance();
}

function startOffers() {
  addDivider('today');
  botSay('⚡ 3 new offers just dropped — say yes to see them', 800, function() {
    setQRs(['yes'], function() {
      clearQRs(); addBubble('user','yes');
      botSay('here\'s what\'s live for you:\n\n1️⃣ tesco — 4% cashback\n2️⃣ boots — 6% cashback\n3️⃣ amazon — 3% cashback\n\nall auto-activated on your linked card 👌', 900, function() {
        setQRs(['choose a category','find me a brand','check my balance'], offersReply);
      });
    });
  });
}

function offersReply(r) {
  clearQRs(); addBubble('user', r);
  if (r==='choose a category') {
    botSay('pick a category 👇', 600, function() { setQRs(CATS, catReply); });
  } else if (r==='find me a brand') {
    botSay('just type the brand name 🔍', 700, function() { enableInp('e.g. nike, currys, zara',''); });
  } else if (r==='check my balance') {
    showBalance();
  }
}

function doSend() {
  var i = document.getElementById('inp');
  var v = i.value.trim(); if (!v || i.disabled) return;
  i.value = '';

  if (flow==='onboarding' && obStage==='brands') {
    disableInp(); addBubble('user', v);
    botSay('brilliant 🙌 we\'re logging all of this — your data is already shaping what we build\n\nwe\'ll be in touch as soon as we\'re ready to onboard you properly. watch this space 🚀\n\n(no spam. just the good stuff.)', 1100, function() {
      obStage = 'done';
    });
    return;
  }

  if (flow==='offers') {
    disableInp(); addBubble('user', v);
    var lv = v.toLowerCase();
    if (lv==='nike' || lv==='asos' || lv==='next' || lv==='zara') {
      botSay(v + ' isn\'t a card-linked partner yet — but we have an affiliate link with 5% cashback 🙌\n\nhead to getcharged.energy/offers to grab your tracked link', 900, function() {
        setQRs(['find another brand','check my balance'], offersReply);
      });
    } else {
      botSay('checking ' + v + ' for live offers... 🔍\n\nwe don\'t have a card-linked deal for ' + v + ' right now — but it\'s been noted and we\'ll add it when we can 👌', 900, function() {
        setQRs(['find another brand','check my balance'], offersReply);
      });
    }
    return;
  }
}

function startAddCard() {
  addDivider('today');
  botSay('let\'s link your card 🔗\n\nthis is the only time you\'ll ever need to do this. once it\'s linked, cashback tracks automatically every time you spend — no codes, no clicking, no faff.', 900, function() {
    botSay('we use fidel to link your card securely 🔒\n\nfidel is pci-dss compliant — we never see your full card number. it just sits in the background and spots when you spend at a partner brand.', 1000, function() {
      botSay('tap below to link your card — takes about 60 seconds 👇', 700, function() {
        // card link bubble
        var m = document.getElementById('msgs');
        var d = document.createElement('div');
        d.className = 'bubble in';
        var pill = document.createElement('a');
        pill.href = 'https://YOUR-FIDEL-LINK-HERE';
        pill.target = '_blank';
        pill.style.cssText = 'display:flex;align-items:center;gap:10px;background:#e6f4ea;border-radius:8px;padding:10px 13px;margin-top:4px;text-decoration:none;cursor:pointer;';
        pill.innerHTML = '<span style="font-size:18px;">🔐</span><div><div style="font-size:13px;font-weight:700;color:#075e54;font-family:Figtree,sans-serif;">securely link your card</div><div style="font-size:11px;color:#4a9e6a;font-family:Figtree,sans-serif;">powered by fidel · pci-dss compliant</div></div><span style="margin-left:auto;font-size:16px;color:#075e54;">→</span>';
        d.appendChild(pill);
        var ts = document.createElement('div');
        ts.className = 'btime'; ts.textContent = t();
        d.appendChild(ts);
        m.appendChild(d);
        scrollDown();
        setTimeout(function() {
          setQRs(['i\'ve linked my card ✅', 'how is my card data protected?', 'which cards work?'], addCardReply);
        }, 400);
      });
    });
  });
}

function addCardReply(r) {
  clearQRs(); addBubble('user', r);
  if (r === 'i\'ve linked my card ✅') {
    botSay('yeah baby ⚡⚡ you\'re live!\n\njust spend as normal at any partner brand and we\'ll handle the rest. cashback lands on your e.on account automatically.\n\nyou\'ll get a whatsapp notification the moment a transaction confirms 🙌', 1000, function() {
      setQRs(['what offers do i have?', 'check my balance'], function(r2) {
        clearQRs(); addBubble('user', r2);
        if (r2 === 'what offers do i have?') {
          botSay('pick a category and i\'ll show you what\'s live 👇', 700, function() {
            setQRs(CATS, catReply);
          });
        } else {
          showBalance();
        }
      });
    });
  } else if (r === 'how is my card data protected?') {
    botSay('great question 🔒\n\nwe use fidel — a pci-dss level 1 certified card-linking platform. that\'s the highest level of payment security there is.\n\nwhat fidel does:\n✅ creates a secure token linked to your card\n✅ monitors for qualifying transactions\n❌ never stores or shares your full card number\n❌ never has access to your bank account\n\nyour card details go directly to fidel\'s secure servers — charged never sees them.', 1100, function() {
      setQRs(['ok, link my card 🔗', 'which cards work?'], addCardReply);
    });
  } else if (r === 'which cards work?') {
    botSay('most uk debit and credit cards work 👌\n\n✅ visa debit\n✅ visa credit\n✅ mastercard debit\n✅ mastercard credit\n\n❌ amex not supported yet\n❌ prepaid cards not supported\n\nyou can link multiple cards if you want — useful if you split spending across accounts.', 1000, function() {
      setQRs(['link my card 🔗', 'can i link more than one?'], function(r2) {
        clearQRs(); addBubble('user', r2);
        if (r2 === 'can i link more than one?') {
          botSay('yes! you can link up to 3 cards 💳\n\nuseful if you use one card for groceries and another for everything else — cashback tracks across all of them automatically.', 800, function() {
            setQRs(['link my card 🔗'], function() {
              clearQRs(); addBubble('user', 'link my card 🔗');
              botSay('tap the link below to get started 👇', 600, function() {
                startAddCard();
              });
            });
          });
        } else {
          botSay('tap the link above to get started 👇', 500);
        }
      });
    });
  } else if (r === 'ok, link my card 🔗' || r === 'link my card 🔗') {
    botSay('tap the link above to get started — takes about 60 seconds 🔗', 600);
  }
}

document.getElementById('inp').addEventListener('keydown', function(e) {
  if (e.key==='Enter') doSend();
});

loadFlow('onboarding');
</script>
